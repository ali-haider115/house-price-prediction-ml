
<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            padding: 25px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        input, select, button {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }
        button {
            background: #1d4ed8;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        .result {
            background: #dcfce7;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>House Price Prediction</h1>

    <form method="POST">
        <div class="grid">
            <div>Area
                <input type="number" name="area" min="1" required>
            </div>
            <div>Bedrooms
                <input type="number" name="bedrooms" min="0" required>
            </div>
            <div>Bathrooms
                <input type="number" name="bathrooms" min="0" required>
            </div>
            <div>Stories
                <input type="number" name="stories" min="1" required>
            </div>
            <div>Main Road
                <select name="mainroad">
                    <option>yes</option><option>no</option>
                </select>
            </div>
            <div>Guestroom
                <select name="guestroom">
                    <option>yes</option><option>no</option>
                </select>
            </div>
            <div>Basement
                <select name="basement">
                    <option>yes</option><option>no</option>
                </select>
            </div>
            <div>Hot Water Heating
                <select name="hotwaterheating">
                    <option>yes</option><option>no</option>
                </select>
            </div>
            <div>Air Conditioning
                <select name="airconditioning">
                    <option>yes</option><option>no</option>
                </select>
            </div>
            <div>Parking Spaces
                <input type="number" name="parking" min="0" required>
            </div>
            <div>Preferred Area
                <select name="prefarea">
                    <option>yes</option><option>no</option>
                </select>
            </div>
            <div>Furnishing Status
                <select name="furnishingstatus">
                    <option>furnished</option>
                    <option>semi-furnished</option>
                    <option>unfurnished</option>
                </select>
            </div>
        </div>
        <button type="submit">Predict Price</button>
    </form>

    {% if prediction is not none %}
    <div class="result">
        <h2>Estimated House Price</h2>
        <h2>{{ prediction }}</h2>
    </div>
    {% endif %}
</div>
</body>
</html>
